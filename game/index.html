.gd-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}

.gd-match{display:flex;flex-direction:column;gap:9px;min-width:0}.mu{display:flex;flex-direction:column;gap:2px;min-width:0}.mu small{font:700 11px var(--cond);letter-spacing:.1em;text-transform:uppercase;color:var(--orange2)}.mu b{font:700 19px/1.15 var(--cond)}.mu>span{font-size:13px;color:var(--muted)}.mu.sm>span{color:var(--text);font:600 15px var(--cond)}.mu .bar{margin-top:3px}
.pbp{display:flex;flex-direction:column;gap:3px;max-height:310px;overflow:auto;font-size:14px}.pbp div{padding:3px 0;border-bottom:1px solid #ffffff0d}
.pbp .pi{font:700 12px var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--orange2);border:0;padding-top:7px}.pbp .p-hr{color:var(--gold);font-weight:700}.pbp .p-run{font-weight:600}.pbp .p-score{font:700 13px var(--cond);color:var(--warn)}.pbp .p-sub,.pbp .p-info{color:var(--muted);font-style:italic}.pbp .p-final{font:700 15px var(--cond);color:var(--warn)}
.gd-prompt{display:flex;flex-direction:column;gap:8px;background:var(--paper);color:var(--paper-ink);border-radius:9px;padding:10px 12px;font-weight:600}
.gd-pick{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:3px;max-height:330px;overflow:auto}.gd-pick .lbl{margin-bottom:4px}
.gd-pick .asset{grid-template-columns:minmax(0,1fr) auto}.gd-pick .asset small{color:var(--muted);font-weight:500}.gd-pick .btn{align-self:flex-start;margin-top:4px}
.gd-ctrl{display:flex;flex-direction:column;gap:7px;position:sticky;bottom:0;background:var(--panel);padding-top:9px;border-top:1px solid var(--line);z-index:2}
.gd-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.gd-row .who-tag{margin-right:4px}
.gd-final{display:flex;flex-direction:column;gap:10px}.gd-final h2{font:400 30px/1.05 var(--display);text-transform:uppercase;text-wrap:balance}.gd-final h2.ok{color:var(--good)}.gd-final h2.no{color:var(--bad)}
.mg{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:flex-start}
#mg-cv{background:var(--wall);border-radius:8px;width:340px;max-width:100%;height:auto;aspect-ratio:1;touch-action:none;cursor:crosshair;user-select:none;-webkit-user-select:none}
.mg-side{flex:1 1 260px;min-width:0;max-width:430px;display:flex;flex-direction:column;gap:7px}
.mg-name{font:400 26px/1 var(--display);text-transform:uppercase}.mg-name small{font:700 13px var(--cond);color:var(--muted)}.mg-vs{font:600 15px var(--cond)}.mg-l{font:700 11px var(--cond);letter-spacing:.1em;text-transform:uppercase;color:var(--orange2)}
.ars{display:flex;flex-wrap:wrap;gap:4px}.pt{font:600 12px var(--cond);border-left:3px solid var(--c);background:#ffffff10;padding:3px 6px;border-radius:3px}.mg-sub{min-height:34px}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
.pbtn{display:flex;flex-direction:column;align-items:flex-start;padding:7px 9px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--c);text-align:left}.pbtn b{font:700 15px var(--cond)}.pbtn small{font:500 12px var(--cond);color:var(--muted)}.pbtn.on{background:var(--acc-sel);border-color:var(--orange)}.pbtn:disabled{opacity:.5;cursor:default}
.plog{display:flex;flex-direction:column;gap:2px;font:500 13px var(--cond);color:var(--muted)}.plog span{display:inline-block;width:16px;color:var(--orange2)}
.chip:disabled,.swing:disabled{opacity:.5;cursor:default}
@media (max-width:900px){.gd-grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){.gd{padding:10px}.gd-score b,.gd-score span{font-size:24px}.wpb{grid-template-columns:auto minmax(80px,1fr) 42px;width:100%}.gd-ctrl .btn{flex:1 1 auto}.pbp{max-height:230px}.gd-field{grid-template-columns:140px minmax(0,1fr)}}
@media (max-width:520px){table.ls td,table.ls th{padding:3px 3px;min-width:17px;font-size:13px}.mg-side .count{order:-4}.mg-side .pmsg{order:-3}.mg-side .mg-sub{order:-2;min-height:0}.mg-side .swing{order:-1}.mg-side .mg-l{margin-top:4px}}
@media (max-width:420px){.gd-field{grid-template-columns:minmax(0,1fr)}.diamond{max-width:190px;margin:0 auto}.mg-side{flex-basis:100%}}
@media (prefers-reduced-motion:reduce){.gd-head.flash{animation:none}}
.tm{display:inline-block;font:700 12px/1 var(--cond);letter-spacing:.05em;text-transform:uppercase;padding:3px 5px 3px 7px;border-radius:3px;background:var(--tb);color:var(--tt);box-shadow:inset 3px 0 0 var(--ts),inset 0 0 0 1px #ffffff26;vertical-align:2px;white-space:nowrap}
.lbl .lt{color:inherit;letter-spacing:inherit;text-transform:inherit;font-weight:inherit}
.bt{font:600 13px var(--cond);letter-spacing:.04em;color:var(--muted)}.bt i{font-style:normal}.bt i.hL{color:#8cc0ff;font-weight:700}.bt i.hS{color:#d6a0ff;font-weight:700}
.tag.hd.hL{background:#3d7fd9;color:#fff}.tag.hd.hS{background:#8a55c9;color:#fff}
.alts{margin-left:5px;font:600 11px var(--cond);letter-spacing:.03em;color:var(--muted);white-space:nowrap}
.fits{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}.fit{font:700 12px/1 var(--cond);letter-spacing:.03em;padding:4px 6px;border-radius:4px;background:#ffffff14}.fit.main,.fit.alt{background:#43e0a02e;color:#8ff5cc}.fit.easy{background:#8cc0ff26;color:#b3d6ff}.fit.stretch{background:#ffd34d26;color:#ffe27a}.fit.bad{background:#ff6b7826;color:#ffaab2}
.teamgrid button[style]{background:var(--tb);color:var(--tt);border-color:transparent;box-shadow:inset 0 -4px 0 var(--ts)}.teamgrid button[style] small{color:inherit;opacity:.85}.teamgrid button[style]:hover{filter:brightness(1.15)}
.teamgrid button[style].on{background:var(--tb);color:var(--tt);outline:3px solid var(--text);outline-offset:1px}
.grade{display:inline-block;min-width:28px;text-align:center;font:700 13px/20px var(--cond);border-radius:4px;padding:0 4px;background:#ffffff1a;color:var(--text)}.grade.gA{background:#43e0a033;color:#8ff5cc}.grade.gB{background:#8cc0ff2e;color:#b3d6ff}.grade.gC{background:#ffd34d26;color:#ffe27a}.grade.gD,.grade.gF{background:#ff6b7826;color:#ffaab2}
.deals{display:flex;flex-direction:column;gap:4px;max-height:286px;overflow:auto}.deal{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:5px 7px;border-radius:5px;background:var(--panel2);font-size:14px}.deal span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.deal small{color:var(--muted)}.deal.me{outline:2px solid var(--orange)}
.bigfas{display:flex;flex-direction:column;gap:4px}.bigfa{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 9px;border-radius:6px;background:var(--panel2);border:1px solid transparent;font-size:14px}.bigfa:hover{border-color:var(--orange2)}.bigfa small{color:var(--muted)}.bigfa .bf-r{display:flex;align-items:center;gap:6px;white-space:nowrap}
@media (max-width:900px){.grid>.c7,.grid>.c5{grid-column:1/-1}}
@media (max-width:760px){.bigfa{flex-direction:column;align-items:flex-start}}
